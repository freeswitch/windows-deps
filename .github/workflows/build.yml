name: Build dependencies

# Builds the Windows dependency packages FreeSWITCH consumes, but only the part of
# the dependency graph a change touches:
#
#   plan     scripts/plan.ps1 reads deps.json + git (diff and tags), expands the
#            changed nodes to their transitive dependents, assigns build numbers.
#   <node>   one job per node of deps.json (below); `needs` mirrors the graph
#            edges, `if` gates each job on the plan. A dependent takes packages
#            built earlier in the same run as artifacts, everything else from
#            GitHub Releases.
#   publish  on push to the default branch (or dispatch with publish=true):
#            one GitHub Release per rebuilt node, tag <node>-v<version>_<build>.
#
# Adding a node to deps.json = adding a job below with the matching `needs`.

on:
  push:
    branches: [main, master]
    paths:
      - deps.json
      - 'deps/**'
      - 'scripts/**'
      - 'docker/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      deps:
        description: 'Dependencies to rebuild: comma-separated names, or "all". Their dependents are rebuilt too.'
        required: true
        default: all
      publish:
        description: 'Publish the rebuilt packages as GitHub Releases'
        type: boolean
        default: false

# Build numbers are derived from existing tags at plan time; serialize runs per
# ref so two pushes cannot compute the same number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.plan.outputs.affected }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        shell: pwsh
        run: |
          # Hashtable splatting: named parameters (an array splat would bind positionally).
          $a = @{ OutFile = 'plan.json'; GitHubOutput = $true }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $sel = '${{ inputs.deps }}'.Trim()
            if ($sel -eq 'all') { $a.All = $true }
            else { $a.Changed = @($sel -split '\s*,\s*' | Where-Object { $_ }) }
          } else {
            $a.BaseRef = '${{ github.event.before }}'
            $a.HeadRef = '${{ github.sha }}'
          }
          ./scripts/plan.ps1 @a

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  # ---- one job per node of deps.json --------------------------------------------
  # `!cancelled()` keeps a job runnable when an upstream job was merely skipped
  # (not affected by this change); the explicit result checks stop the chain when
  # an upstream build actually failed. Membership is tested on the JSON text of
  # `affected` (e.g. ["zlib","openssl"]) with the quotes included, so it is exact
  # and never breaks on an empty output the way fromJSON('') would.

  zlib:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"zlib"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: zlib

  openssl:
    needs: [plan, zlib]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"openssl"') && needs.zlib.result != 'failure' && needs.zlib.result != 'cancelled' }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: openssl

  libpng:
    needs: [plan, zlib]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libpng"') && needs.zlib.result != 'failure' && needs.zlib.result != 'cancelled' }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libpng

  libks:
    needs: [plan, openssl]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libks"') && needs.openssl.result != 'failure' && needs.openssl.result != 'cancelled' }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libks

  signalwire-client-c:
    needs: [plan, libks, openssl]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"signalwire-client-c"') && needs.libks.result != 'failure' && needs.libks.result != 'cancelled' && needs.openssl.result != 'failure' && needs.openssl.result != 'cancelled' }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: signalwire-client-c

  curl:
    needs: [plan, zlib, openssl]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"curl"') && needs.zlib.result != 'failure' && needs.zlib.result != 'cancelled' && needs.openssl.result != 'failure' && needs.openssl.result != 'cancelled' }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: curl

  libpcap:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libpcap"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libpcap

  rabbitmq-c:
    needs: [plan, openssl]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"rabbitmq-c"') && needs.openssl.result != 'failure' && needs.openssl.result != 'cancelled' }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: rabbitmq-c

  libpq:
    needs: [plan, openssl]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libpq"') && needs.openssl.result != 'failure' && needs.openssl.result != 'cancelled' }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libpq

  mariadb-connector-c:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"mariadb-connector-c"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: mariadb-connector-c
  g722_1:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"g722_1"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: g722_1
  ilbc:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"ilbc"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: ilbc
  libsilk:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libsilk"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libsilk
  libtiff:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libtiff"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libtiff
  lame:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"lame"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: lame
  libogg:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libogg"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libogg
  pthreads:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"pthreads"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: pthreads
  libshout:
    needs: [plan, libogg, pthreads]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"libshout"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: libshout
  broadvoice:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"broadvoice"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: broadvoice
  opencv:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"opencv"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: opencv
  pcre:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"pcre"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: pcre
  flite:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"flite"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: flite
  lua:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.affected, '"lua"') }}
    uses: ./.github/workflows/build-dep.yml
    with:
      dep: lua

  # ---- publish ------------------------------------------------------------------
  # The `if` must rule out an empty/'[]' affected list BEFORE the matrix below is
  # expanded: GitHub evaluates `if` first, then `strategy`.
  publish:
    needs: [plan, zlib, openssl, libpng, libks, signalwire-client-c, curl, libpcap, rabbitmq-c, libpq, mariadb-connector-c, g722_1, ilbc, libsilk, libtiff, lame, libogg, pthreads, libshout, broadvoice, opencv, pcre, flite, lua]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.affected != '' && needs.plan.outputs.affected != '[]' && (github.event_name == 'push' || inputs.publish) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create tags + releases
    strategy:
      fail-fast: false
      matrix:
        dep: ${{ fromJSON(needs.plan.outputs.affected) }}
    steps:
      - name: Get package
        uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.dep }}
          path: pkg

      - name: Release ${{ fromJSON(needs.plan.outputs.plan).nodes[matrix.dep].tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ fromJSON(needs.plan.outputs.plan).nodes[matrix.dep].tag }}
          name: ${{ fromJSON(needs.plan.outputs.plan).nodes[matrix.dep].tag }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ${{ matrix.dep }} ${{ fromJSON(needs.plan.outputs.plan).nodes[matrix.dep].version }}, build ${{ fromJSON(needs.plan.outputs.plan).nodes[matrix.dep].build }}, from ${{ github.sha }}.
            The `*-BOM.txt` asset lists the exact dependency packages this was built against.
          files: |
            pkg/*.zip
            pkg/SHA256SUMS.txt
            pkg/*-BOM.txt
